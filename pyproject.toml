[project]
name = "antibioticjepa"
version = "0.1.0"
description = "Graph Transformer pretrained with LeJEPA on ZINC20 and finetuned for antibiotic discovery"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # deep learning
    # NOTE: GTX 1080 is Pascal (compute capability sm_61). PyTorch wheels built
    # against CUDA 13 (the default modern build) DROPPED Pascal entirely, so they
    # fail on the 1080 with "no kernel image is available for execution on the
    # device". We therefore pin a CUDA 11.8 (cu118) build, whose binaries still
    # ship sm_61 kernels. cu118 also runs fine on newer cards (e.g. RTX 3090,
    # sm_86), so the same branch works on both the HPC 1080s and a dev box.
    # Source override below points torch at the cu118 index.
    "torch==2.4.1",
    "torch-geometric>=2.5.0",
    # torch-geometric >=2.6 hard-imports xxhash at package import time (for
    # HashTensor) even though we never use it — without xxhash, `import
    # torch_geometric` raises ModuleNotFoundError. Pin it explicitly so the
    # dependency is always present.
    "xxhash>=3.4.0",
    # molecular cheminformatics
    "rdkit>=2024.3.1",
    # config management
    "omegaconf>=2.3.0",
    # experiment tracking
    "wandb>=0.17.0",
    # data science utilities
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    # progress bars
    "tqdm>=4.66.0",
    "openpyxl>=3.1.5",
    "matplotlib>=3.10.9",
    "umap-learn>=0.5.12",
    "huggingface-hub>=1.17.0",
    "pyarrow>=24.0.0",
    "xgboost>=3.2.0",
    "descriptastorus>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]

# --- PyTorch CUDA 11.8 build for Pascal (GTX 1080) support --------------------
# uv fetches torch from the cu118 wheel index instead of PyPI's default
# (CUDA 13) build. `explicit = true` keeps this index scoped to torch only, so
# every other dependency still resolves from PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]
